name: cda_cbp

# Tests cda_cbp (Continual Backprop for gym-continuousDoubleAuction) against an
# installed gym-CDA.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      gym_cda_ref:
        description: gym-continuousDoubleAuction branch, tag or commit to test against
        required: false
  schedule:
    # Weekly drift check: tests the upstream default branches rather than the
    # pins below, so a change there is caught without turning PRs red (#19).
    - cron: "0 3 * * 1"

permissions:
  contents: read

env:
  # Pinned to a commit, so a green run is reproducible and an upstream change
  # cannot turn main red with no commit here. The scheduled run and the
  # workflow_dispatch input override it; docs/development.md says how to move it.
  GYM_CDA_REF: ${{ inputs.gym_cda_ref || (github.event_name == 'schedule' && 'master' || '3ae05e01317b9c65d97ce7eb4832696478415438') }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      # Pinned by SHA; Dependabot keeps the pins current (.github/dependabot.yml).
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The authors' loss-of-plasticity code, shipped unchanged as `lop`.
          submodules: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install the lint tools
        run: |
          python -m pip install --upgrade pip
          pip install "ruff==0.17.4" pyflakes

      - name: Format
        run: ruff format --check .

      - name: Pyflakes
        run: python -m pyflakes cda_cbp tests

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The authors' loss-of-plasticity code, shipped unchanged as `lop`.
          submodules: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install gym-CDA (CPU torch) and cda_cbp
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.13.0 --extra-index-url https://download.pytorch.org/whl/cpu
          pip install "gym_continuousDoubleAuction @ git+https://github.com/ChuaCheowHuan/gym-continuousDoubleAuction@${GYM_CDA_REF}"
          pip install -e ".[test,dev]"

      - name: Track cda-jepa's main branch (scheduled drift check)
        if: github.event_name == 'schedule'
        run: pip install --force-reinstall "cda-jepa @ git+https://github.com/ChuaCheowHuan/cda_jepa@main"

      - name: Types
        run: mypy cda_cbp/cbp.py

      - name: Tests, including real training iterations and the lop reference test
        run: python -m pytest -q
