name: cda_cbp

# Tests cda_cbp (Continual Backprop for gym-continuousDoubleAuction) against an
# installed gym-CDA.
#
# Lives in ci/ until it is copied to .github/workflows/: the session that wrote
# it could not push workflow files.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      gym_cda_ref:
        description: gym-continuousDoubleAuction branch, tag or commit to test against
        required: false

env:
  # A gym-CDA ref with `learner_order`, `train/model/layout.py`,
  # `optim_learner.adam_settings` and `effective_rank(..., too_few_rows=)`.
  GYM_CDA_REF: ${{ inputs.gym_cda_ref || 'master' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # The authors' loss-of-plasticity code, shipped unchanged as `lop`.
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install gym-CDA (CPU torch) and cda_cbp
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.13.0 --extra-index-url https://download.pytorch.org/whl/cpu
          pip install "gym_continuousDoubleAuction @ git+https://github.com/ChuaCheowHuan/gym-continuousDoubleAuction@${GYM_CDA_REF}"
          pip install ".[test]"

      - name: Tests, including real training iterations and the lop reference test
        run: python -m pytest -q
