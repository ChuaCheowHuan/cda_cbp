[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cda-cbp"
version = "0.2.0"
description = "Continual Backprop for gym-continuousDoubleAuction, as an installable training extension."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "third_party/loss-of-plasticity/LICENSE"]
# gym-CDA is not on PyPI: install it first (see README). It must carry the
# extension point with `learner_order` and `train/model/layout.py`.
dependencies = ["gym_continuousDoubleAuction>=2.1,<3"]

[project.optional-dependencies]
# cda-jepa provides the `jepa` encoder once gym-CDA no longer ships it; the tests that
# use it skip without it (tests/conftest.py, requires_jepa). Pinned to a commit for
# the same reason GYM_CDA_REF is (docs/development.md); the scheduled CI run moves
# both to their upstream default branches.
test = [
    "pytest",
    "cda-jepa @ git+https://github.com/ChuaCheowHuan/cda_jepa@dab4583c50b11df08ec84632c705afaec6b338fc",
]
dev = ["pytest", "ruff==0.17.4", "pyflakes", "mypy==2.4.1"]

[project.entry-points."gym_cda.extensions"]
cbp = "cda_cbp:EXTENSION"

# `lop` is the loss-of-plasticity authors' code, a git submodule shipped unchanged
# as a top-level package. Only the parts used are listed: `lop.envs` and the
# experiment scripts need gym 0.23 and mujoco. Its own setup.py packages nothing
# (no `lop/__init__.py`), which is why it is not a pip dependency.
[tool.setuptools]
packages = ["cda_cbp", "lop", "lop.utils", "lop.algos"]

[tool.setuptools.package-dir]
lop = "third_party/loss-of-plasticity/lop"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
# `cbp.py` is the algorithm and is the file CI type-checks. Its dependencies are
# untyped third-party packages and gym-CDA, hence the ignore. Imports are not
# followed, so checking this one file does not pull in the mixin's `super()`
# calls into a base class that does not exist until gym-CDA composes it.
files = ["cda_cbp/cbp.py"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.ruff]
line-length = 100
# The authors' code, shipped unchanged (tests/test_lop.py); never reformat it.
extend-exclude = ["third_party"]

[tool.ruff.format]
quote-style = "preserve"
